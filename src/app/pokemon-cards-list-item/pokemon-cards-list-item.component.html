<mat-card>
<div class="cards-item">
  <mat-card-title><h2>{{pokemonCards.name}}</h2></mat-card-title>
  <mat-card-content><p>{{pokemonCards.description}}</p></mat-card-content>
  <p>Price: ${{pokemonCards.price}}</p>
  <p>Rarity: {{pokemonCards.rarity}}</p>
  <img [src]="pokemonCards.imageUrl">
  <mat-card-actions>
  <button mat-raised-button color="primary" >Get Pack</button>
  </mat-card-actions>
</div>
</mat-card>
