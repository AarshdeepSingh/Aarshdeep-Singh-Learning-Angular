<form [formGroup]="modifyForm" (ngSubmit)="onSubmit()">
  <!-- Name Field -->
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput id="name" formControlName="name" type="text">
  </mat-form-field>

  <!-- Description Field -->
  <mat-form-field appearance="outline">
    <mat-label>Description</mat-label>
    <input matInput id="description" formControlName="description" type="text">
  </mat-form-field>

  <!-- Price Field -->
  <mat-form-field appearance="outline">
    <mat-label>Price</mat-label>
    <input matInput id="price" formControlName="price" type="number">
  </mat-form-field>

  <!-- Rarity Field -->


  <!-- Image URL Field -->
  <mat-form-field appearance="outline">
    <mat-label>Image URL</mat-label>
    <input matInput id="imageUrl" formControlName="imageUrl" type="text">
  </mat-form-field>

  <!-- Action Buttons -->
  <div class="action-buttons">
    <button mat-stroked-button color="primary" type="submit" *ngIf="!isEditing">Add Item</button>
    <button mat-stroked-button color="primary" type="submit" *ngIf="isEditing">Update Item</button>
  </div>
</form>
