<div>
  <app-navbar></app-navbar>

  <h1>Pokemon Cards Collection</h1>
</div>

<div *ngFor="let card of PokemonCardsList; let i = index" [ngClass]="{'even': i % 2 === 0, 'odd': i % 2 !== 0}">
  <app-pokemon-cards-list-item [pokemonCards]="card" [ngStyle]="{'background-color': i % 2 === 0 ? 'red' : 'blue'}">
  </app-pokemon-cards-list-item>
  <p [innerHTML]="card.name | boldCardName">Name: {{ card.name | uppercase}}</p>
  <p>Price: {{ card.price | currency }}</p>

</div>

<router-outlet></router-outlet>
<app-pokemon-cards-list></app-pokemon-cards-list>
