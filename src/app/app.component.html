import { Pipe, PipeTransform } from '@angular/core';

@Pipe({
  name: 'isGoodBoy'
})
export class IsGoodBoyPipe implements PipeTransform {
  // Define the transform function
  transform(value: boolean): string {
    return value ? 'Good Boy' : 'Bad Boy';
  }
}

import { Pipe, PipeTransform } from '@angular/core';

@Pipe({
  standalone: true,
  name: 'experiencePipe'
})
export class ExperiencePipePipe implements PipeTransform {

  transform(experience: number): String {
    return experience > 0 ? `${experience} years of experience` : `new sitter`;
  }

}

import { Component } from '@angular/core';
import { FormBuilder, FormGroup, Validators, ReactiveFormsModule } from '@angular/forms';

@Component({
  selector: 'app-modify-sitter-component',
  standalone: true,
  imports: [ReactiveFormsModule], // Include ReactiveFormsModule
  templateUrl: './modify-sitter-component.component.html',
  styleUrls: ['./modify-sitter-component.component.scss']
})
export class ModifySitterComponentComponent {
  sitterForm: FormGroup;

  constructor(private fb: FormBuilder) {
    // Initialize the reactive form with controls and validators
    this.sitterForm = this.fb.group({
      name: ['', [Validators.required, Validators.minLength(2)]],
      age: ['', [Validators.required, Validators.min(18), Validators.max(65)]],
      experience: ['', [Validators.required, Validators.min(0)]],
      specialty: ['', [Validators.required]],
      availability: ['', [Validators.required]]
    });
  }

   ngOnInit(): void {

    const sitterId = this.route.snapshot.paramMap.get('id');
    if (sitterId) {
      this.isNewSitter = false;
      this.sitter = SITTERS.find(s => s.id === +sitterId);
      if (this.sitter) {
        this.sitterForm.patchValue(this.sitter);
      }
    }
  }

  // Submit handler for the form
  onSubmit(): void {
    if (this.sitterForm.valid) {
      const sitterData = this.sitterForm.value;
      console.log('Form Submitted Successfully:', sitterData);

      // Logic for adding or updating sitter
      // Example: API call or updating a local list
    } else {
      this.sitterForm.markAllAsTouched(); // Mark all fields as touched to trigger validation messages
    }
  }

  // Convenience getters for accessing form controls
  get name() {
    return this.sitterForm.get('name');
  }

  get age() {
    return this.sitterForm.get('age');
  }

  get experience() {
    return this.sitterForm.get('experience');
  }

  get specialty() {
    return this.sitterForm.get('specialty');
  }

  get availability() {
    return this.sitterForm.get('availability');
  }
}

  onSubmit(): void {
    if (this.sitterForm.valid) {
      if (this.isNewSitter) {
        // Adding new sitter logic
        const newSitter: PetSitter = {
          ...this.sitterForm.value, id: SITTERS.length + 1,
        };
        SITTERS.push(newSitter);
      } else {
        // Updating existing sitter logic
        if (this.sitter) {
          this.sitter = { ...this.sitterForm.value, id: this.sitter.id };
          //Type assertion, to work around my null error
          const index = SITTERS.findIndex(s => s.id === (this.sitter as PetSitter).id);
          if (index !== -1) {
            // Update the sitter in the array only if it's found + Type assertion
            SITTERS[index] = { ...this.sitterForm.value, id: (this.sitter as PetSitter).id };
          }
        }
      }

      this.router.navigate(['/sitters']);
    }
  }
}

  import {Directive, ElementRef, HostListener, Renderer2} from '@angular/core';

@Directive({
  standalone: true,
  selector: '[appHighlight]'
})
export class HighlightDirective {
  constructor(private el: ElementRef, private renderer: Renderer2) {}

  @HostListener('mouseenter') onMouseEnter() {
    this.renderer.addClass(this.el.nativeElement, 'highlight');
  }

  @HostListener('mouseleave') onMouseLeave() {
    this.renderer.removeClass(this.el.nativeElement, 'highlight');
  }
}

        this.el.nativeElement,
        'background-color',
        'yellow'
      );
    }
  }

  constructor(private el: ElementRef, private renderer: Renderer2) {}
}


import { Directive, Renderer2, ElementRef, HostListener } from '@angular/core';

@Directive({
  selector: '[flashBackground]',
})
export class FlashBackgroundDirective {
  private colors: string[] = ['red', 'yellow', 'blue'];
  private currentIndex = 0;

  constructor(private el: ElementRef, private renderer: Renderer2) {}

  @HostListener('mouseenter') onMouseEnter() {
    this.flash();
  }

  private flash() {
    const color = this.colors[this.currentIndex];
    this.renderer.setStyle(this.el.nativeElement, 'background-color', color);
    this.currentIndex = (this.currentIndex + 1) % this.colors.length;
    setTimeout(() => this.flash(), 500); // Change every 500ms
  }
}
